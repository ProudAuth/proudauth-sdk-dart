name: proudauth_sdk
description: >-
  Dart SDK for ProudAuth: offline access-token verification, strict-online
  introspection with the support-access contract, bounded-state verification,
  a backend-for-frontend OIDC client and a typed administration client.
version: 0.2.0
publish_to: none
repository: https://github.com/proudbase/proudauth-sdk-dart
issue_tracker: https://github.com/proudbase/proudauth-sdk-dart/issues
homepage: https://proudauth.com/docs/

environment:
  sdk: ^3.4.0

dependencies:
  crypto: ^3.0.6
  http: ^1.5.0

dev_dependencies:
  lints: ^6.1.0
  test: '>=1.31.0 <1.32.0'
