name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: "3.13.3"
      - name: Verify vendored contracts
        run: python3 scripts/check-contracts.py
      - name: Locked dependencies
        run: dart pub get --enforce-lockfile
      - name: Analyze, format and test
        run: |
          dart analyze
          dart format --output=none --set-exit-if-changed .
          dart test
